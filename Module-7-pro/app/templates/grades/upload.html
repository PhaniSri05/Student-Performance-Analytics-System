{% extends "base.html" %}

{% block title %}Upload Grades{% endblock %}

{% block content %}

<h1>Upload Grades CSV</h1>

<div class="card">

    <p>
        CSV must contain these columns:
    </p>

    <strong>
        student_id, course_id, score
    </strong>

    <br><br>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="file"
            accept=".csv"
            required
        >

        <br><br>

        <button type="submit">
            Upload CSV
        </button>

    </form>

</div>

{% endblock %}
