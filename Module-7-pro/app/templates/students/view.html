{% extends "base.html" %}

{% block title %}Student Details{% endblock %}

{% block content %}

<h1>Student Details</h1>

<div class="card">

    <p><strong>ID:</strong> {{ student.id }}</p>

    <p><strong>Name:</strong> {{ student.name }}</p>

    <p><strong>Email:</strong> {{ student.email }}</p>

    <a href="/students/{{ student.id }}/edit">
        <button>Edit</button>
    </a>

    <a href="/students">
        <button>Back</button>
    </a>

</div>

{% endblock %}
