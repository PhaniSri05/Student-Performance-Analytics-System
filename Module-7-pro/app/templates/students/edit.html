{% extends "base.html" %}

{% block title %}Edit Student | Student Analytics{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Edit Student</h1>
    <p>Update student information.</p>
</div>

<div class="card" style="max-width:700px;">

    <h2>Student Information</h2>

    <p style="color:#6b7280; margin:8px 0 25px;">
        Update the details below and save your changes.
    </p>

    <form method="POST">

        <div class="form-group">

            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                value="{{ student.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                value="{{ student.email }}"
                required
            >

        </div>


        <div style="
            display:flex;
            gap:10px;
            margin-top:25px;
        ">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Update Student
            </button>

            <a
                href="/students"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
