{% extends "base.html" %}

{% block title %}Add Course | Student Analytics{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Add Course</h1>
    <p>Create a new academic course.</p>
</div>

<div class="card" style="max-width:700px;">

    <h2>Course Information</h2>

    <p style="color:#6b7280; margin:8px 0 25px;">
        Enter the course name and unique course code.
    </p>

    <form method="POST">

        <div class="form-group">

            <label for="name">
                Course Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="Example: Java Programming"
                required
            >

        </div>


        <div class="form-group">

            <label for="code">
                Course Code
            </label>

            <input
                type="text"
                id="code"
                name="code"
                class="form-control"
                placeholder="Example: CS101"
                required
            >

        </div>


        <div style="
            display:flex;
            gap:10px;
            margin-top:25px;
        ">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Course
            </button>

            <a
                href="/courses"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
